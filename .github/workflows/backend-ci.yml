name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: batchflow
          POSTGRES_USER: batchflow
          POSTGRES_PASSWORD: batchflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batchflow -d batchflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://batchflow:batchflow@localhost:5432/batchflow
      APP_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check model and migration parity
        run: alembic check
      - name: Verify idempotent reference seeding
        run: |
          python -m app.db.seed_reference_data
          python -m app.db.seed_reference_data
