services:
  postgres:
    image: postgres:16-alpine
    container_name: batchflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-batchflow}
      POSTGRES_USER: ${POSTGRES_USER:-batchflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - batchflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batchflow} -d ${POSTGRES_DB:-batchflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  batchflow_postgres_data:
